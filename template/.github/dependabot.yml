version: 2
updates:
  # Covers gradle/libs.versions.toml
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Released in lockstep: bumping one alone breaks the build.
      compose-multiplatform:
        patterns:
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
