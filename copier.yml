_min_copier_version: "9.19.1"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

# Created once, then owned by the generated project: `copier update` never overwrites them.
_skip_if_exists:
  - README.md
  - CLAUDE.md
  - docs/conventions.md
  - version.properties

# Optional parts are plain files in template/, dropped here per option. Patterns match rendered paths (no .jinja).
_exclude:
  - "{% if not include_persistence %}composeApp/src/*/kotlin/**/data/db{% endif %}"
  - "{% if not include_persistence %}composeApp/src/*/kotlin/**/RoomSampleRepository*.kt{% endif %}"
  - "{% if not include_persistence %}composeApp/db-schemas{% endif %}"
  - "{% if not include_networking %}composeApp/src/*/kotlin/**/base/network{% endif %}"
  - "{% if not include_networking %}composeApp/src/*/kotlin/**/data/remote{% endif %}"
  - "{% if not include_bottom_nav %}composeApp/src/*/kotlin/**/ui/bottomnav{% endif %}"
  - "{% if not include_bottom_nav %}composeApp/src/*/kotlin/**/ui/settings{% endif %}"
  - "{% if not include_desktop %}composeApp/src/desktopMain{% endif %}"
  - "{% if not include_desktop %}composeApp/src/desktopTest{% endif %}"
  - "{% if not include_desktop %}composeApp/proguard-desktop.pro{% endif %}"
  - "{% if not include_persistence %}composeApp/src/sqliteTest{% endif %}"
  - "{% if not include_library_module %}/{{ library_module_name }}{% endif %}"
  - "{% if not include_sonar %}/sonar_scan.sh{% endif %}"
  - "{% if not include_networking %}composeApp/src/*/kotlin/**/ErrorLocalizerTest.kt{% endif %}"
  - "{% if include_persistence %}composeApp/src/*/kotlin/**/InMemorySampleRepository.kt{% endif %}"

_message_after_copy: |
  {{ app_display_name }} generated.

  Next steps:
    1. git init && git add -A && git commit -m "generated from template"
       (copier update needs a clean git repository)
    2. iOS signing: create iosApp/Configuration/Local.xcconfig with `TEAM_ID=<your team id>`
       (gitignored)
    3. ./gradlew :composeApp:assembleDebug

  Optional parts are chosen now. Switching one off later is a manual removal: `copier update`
  with a changed answer deletes the generated files, including your edits to them.

app_name:
  type: str
  help: App identifier in PascalCase (class names, iOS product name)
  default: MyApp
  validator: >-
    {% if not (app_name | regex_search('^[A-Z][A-Za-z0-9]*$')) %}
    Must be PascalCase: a capital letter followed by letters or digits.
    {% endif %}

app_display_name:
  type: str
  help: Name shown under the launcher icon / on the iOS home screen (spaces allowed)
  default: "{{ app_name }}"
  validator: >-
    {% if not app_display_name.strip() or app_display_name[0] in '@?' %}
    Must not be empty or start with @ or ?.
    {% endif %}

package_name:
  type: str
  help: Reverse-DNS package, Android application id and iOS bundle id
  default: "com.example.{{ app_name | lower }}"
  # Kotlin hard keywords + Java reserved words: neither may appear as a package segment.
  validator: >-
    {% set reserved = ['as', 'break', 'class', 'continue', 'do', 'else', 'false', 'for', 'fun',
    'if', 'in', 'interface', 'is', 'null', 'object', 'package', 'return', 'super', 'this',
    'throw', 'true', 'try', 'typealias', 'typeof', 'val', 'var', 'when', 'while', 'abstract',
    'assert', 'boolean', 'byte', 'case', 'catch', 'char', 'const', 'default', 'double', 'enum',
    'extends', 'final', 'finally', 'float', 'goto', 'implements', 'import', 'instanceof', 'int',
    'long', 'native', 'new', 'private', 'protected', 'public', 'short', 'static', 'strictfp',
    'switch', 'synchronized', 'throws', 'transient', 'void', 'volatile'] %}
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$')) %}
    Must be a reverse-DNS name like com.example.app (lowercase segments, at least two).
    {% elif package_name.split('.') | select('in', reserved) | list %}
    Segment(s) {{ package_name.split('.') | select('in', reserved) | join(', ') }} are reserved
    words in Kotlin/Java.
    {% endif %}

include_persistence:
  type: bool
  help: Room database with a storage error boundary
  default: true

include_networking:
  type: bool
  help: Ktor HTTP client + BuildKonfig base URL flavors
  default: true

include_bottom_nav:
  type: bool
  help: Adaptive bottom navigation (rail on wide screens); off = single start screen
  default: true

include_desktop:
  type: bool
  help: JVM desktop target in addition to Android and iOS
  default: false

author:
  type: str
  help: Vendor name for desktop packages
  when: "{{ include_desktop }}"
  validator: >-
    {% if not author.strip() %}Required for desktop packaging.{% endif %}

include_library_module:
  type: bool
  help: An empty Kotlin Multiplatform library module
  default: false

library_module_name:
  type: str
  help: Gradle name of the library module
  default: core
  when: "{{ include_library_module }}"
  validator: >-
    {% set reserved = ['as', 'break', 'class', 'continue', 'do', 'else', 'false', 'for', 'fun',
    'if', 'in', 'interface', 'is', 'null', 'object', 'package', 'return', 'super', 'this',
    'throw', 'true', 'try', 'typealias', 'typeof', 'val', 'var', 'when', 'while', 'abstract',
    'assert', 'boolean', 'byte', 'case', 'catch', 'char', 'const', 'default', 'double', 'enum',
    'extends', 'final', 'finally', 'float', 'goto', 'implements', 'import', 'instanceof', 'int',
    'long', 'native', 'new', 'private', 'protected', 'public', 'short', 'static', 'strictfp',
    'switch', 'synchronized', 'throws', 'transient', 'void', 'volatile'] %}
    {% if not (library_module_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Lowercase letters and digits, single dashes between words (e.g. shared-utils).
    {% elif library_module_name | lower in ['build', 'gradle', 'buildsrc', 'docs', 'iosapp', 'composeapp'] %}
    "{{ library_module_name }}" collides with a project folder or the build output.
    {% elif (library_module_name | replace('-', '')) in reserved %}
    "{{ library_module_name | replace('-', '') }}" is a reserved word in Kotlin/Java and cannot be a package.
    {% endif %}

include_sonar:
  type: bool
  help: SonarQube Gradle plugin + scan script
  default: false

sonar_host_url:
  type: str
  help: SonarQube server URL
  when: "{{ include_sonar }}"
  validator: >-
    {% if not (sonar_host_url | regex_search('^https?://[^\\s"$\\\\]+$')) %}
    Must be an http(s) URL without spaces, quotes, $ or backslashes.
    {% endif %}

sonar_project_key:
  type: str
  help: SonarQube project key
  default: "{{ app_name | lower }}"
  when: "{{ include_sonar }}"
  validator: >-
    {% if not (sonar_project_key | regex_search('^[A-Za-z0-9_.:-]*[A-Za-z_.:-][A-Za-z0-9_.:-]*$')) %}
    Letters, digits, '-', '_', '.' and ':' only, with at least one non-digit.
    {% endif %}

package_path:
  type: str
  default: "{{ package_name | replace('.', '/') }}"
  when: false

library_package:
  type: str
  default: "{{ library_module_name | replace('-', '') | lower }}"
  when: false

library_class:
  type: str
  default: "{{ library_module_name.split('-') | map('capitalize') | join('') }}Info"
  when: false
